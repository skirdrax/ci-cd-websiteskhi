<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Seberapa Buzzer kamu? | CEK SKOR BUZZER</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #050811);
        font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 35px 35px;
        pointer-events: none;
        z-index: 0;
      }

      .app-wrap {
        max-width: 1300px;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        justify-content: center;
        position: relative;
        z-index: 2;
      }

      .game-panel {
        flex: 1.6;
        min-width: 340px;
        background: rgba(8, 12, 28, 0.75);
        backdrop-filter: blur(14px);
        border-radius: 56px;
        padding: 28px;
        border: 2px solid rgba(0, 255, 255, 0.5);
        box-shadow:
          0 20px 45px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(0, 255, 255, 0.15);
        transition: all 0.3s;
      }

      .leader-panel {
        flex: 0.6;
        min-width: 260px;
        background: rgba(6, 10, 22, 0.8);
        backdrop-filter: blur(12px);
        border-radius: 40px;
        padding: 18px;
        border: 1px solid cyan;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }

      .leader-panel::before {
        content: '⚡';
        position: absolute;
        top: -5px;
        right: -5px;
        font-size: 45px;
        opacity: 0.2;
        pointer-events: none;
      }

      h1 {
        font-size: 1.7rem;
        text-align: center;
        background: linear-gradient(135deg, #ffd966, #ffb347, #ff8c00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 2px;
      }

      .sub {
        text-align: center;
        color: #88c0ff;
        margin-bottom: 15px;
        font-size: 0.7rem;
        letter-spacing: 2px;
        border-bottom: 1px dashed cyan;
        display: inline-block;
        width: auto;
        margin-left: auto;
        margin-right: auto;
        padding-bottom: 6px;
      }

      h2 {
        color: cyan;
        font-size: 1rem;
        margin-bottom: 12px;
        text-align: center;
      }

      .nama-wrapper {
        display: flex;
        gap: 10px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .nama-input {
        flex: 2;
        padding: 12px 18px;
        border-radius: 48px;
        border: 1.5px solid #ffb347;
        background: #0a1022;
        color: #ffe9c7;
        font-size: 0.9rem;
        outline: none;
        font-weight: 600;
        text-align: center;
      }

      .nama-input:focus {
        border-color: cyan;
        box-shadow: 0 0 15px cyan;
      }

      .nama-input::placeholder {
        color: #88c0ff;
        font-weight: normal;
        opacity: 0.7;
      }

      .btn-random {
        background: #1e2a4a;
        border: 1px solid cyan;
        padding: 0 20px;
        border-radius: 60px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.2s;
      }

      .btn-random:hover {
        background: cyan;
        color: black;
        box-shadow: 0 0 15px cyan;
      }

      .indikator-soal {
        text-align: center;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 255, 255, 0.2),
          transparent
        );
        padding: 8px;
        border-radius: 40px;
        margin-bottom: 18px;
        font-weight: bold;
        color: cyan;
        font-size: 0.8rem;
      }

      .question-card {
        background: rgba(0, 0, 0, 0.5);
        border-radius: 40px;
        padding: 20px;
        margin: 15px 0;
        border: 1px solid rgba(255, 215, 0, 0.5);
        backdrop-filter: blur(4px);
      }

      .question {
        font-size: 1rem;
        font-weight: 700;
        color: #ffe69a;
        margin-bottom: 22px;
        line-height: 1.5;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option-btn {
        background: linear-gradient(95deg, #0f142e, #181e3a);
        border: 1px solid rgba(255, 180, 70, 0.6);
        padding: 12px 18px;
        border-radius: 50px;
        font-weight: 700;
        color: #f5e6c8;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.85rem;
        text-align: left;
      }

      .option-btn:hover:not(:disabled) {
        background: linear-gradient(95deg, #ffb347, #ff8c00);
        color: black;
        transform: scale(1.01);
        border-color: white;
        box-shadow: 0 0 12px orange;
      }

      .option-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .feedback {
        margin-top: 12px;
        padding: 10px;
        border-radius: 40px;
        text-align: center;
        font-weight: bold;
        font-size: 0.85rem;
      }

      .feedback.benar {
        background: #1b5e2a;
        color: #e8f5e9;
        animation: blinkGreen 0.3s ease;
      }

      .feedback.salah {
        background: #a51c30;
        color: #fff0f0;
      }

      @keyframes blinkGreen {
        0% {
          transform: scale(1);
          background: #2e8b3a;
        }
        50% {
          transform: scale(1.02);
          background: #4caf50;
        }
        100% {
          transform: scale(1);
          background: #1b5e2a;
        }
      }

      .score-badge {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        background: #00000066;
        border-radius: 60px;
        padding: 6px 18px;
        margin: 12px 0 5px;
        flex-wrap: wrap;
      }

      .score-badge span:first-child {
        color: #ffd966;
        font-weight: bold;
      }

      .score-badge span:last-child {
        background: linear-gradient(135deg, gold, #ffa500);
        padding: 4px 20px;
        border-radius: 60px;
        font-size: 1.3rem;
        font-weight: bold;
        color: black;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 8px 22px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.8rem;
      }

      .btn-next {
        background: linear-gradient(95deg, gold, #ffae42);
        color: #1e1e2a;
      }

      .btn-restart {
        background: #2a2a4a;
        border: 1px solid cyan;
        color: cyan;
      }

      .btn-send {
        background: #0f6b3a;
        border: 1px solid #25d865;
        color: white;
      }

      .btn-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-send-ready {
        background: linear-gradient(95deg, #ff8c00, #ff5500);
        border: 1px solid gold;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(255, 140, 0, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 140, 0, 0);
        }
      }

      .btn-refresh {
        background: #005c99;
        border: 1px solid cyan;
        color: white;
        padding: 5px 12px;
        font-size: 0.7rem;
      }

      .kategori-badge {
        text-align: center;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 255, 200, 0.15),
          transparent
        );
        border-radius: 40px;
        padding: 8px;
        margin: 12px 0;
        font-size: 0.75rem;
        font-weight: bold;
        color: #ffd966;
      }

      .leader-list {
        max-height: 280px;
        overflow-y: auto;
        margin-top: 8px;
      }

      .leader-item {
        display: flex;
        justify-content: space-between;
        background: rgba(0, 255, 255, 0.1);
        margin: 5px 0;
        padding: 6px 10px;
        border-radius: 40px;
        border-left: 3px solid cyan;
        font-weight: bold;
        font-size: 0.7rem;
      }

      .rank {
        color: cyan;
        font-weight: bold;
        min-width: 30px;
      }

      .leader-name {
        color: #ffd966;
        text-transform: capitalize;
        flex: 1;
        margin-left: 8px;
      }

      .leader-score {
        background: gold;
        padding: 2px 8px;
        border-radius: 30px;
        color: black;
        font-size: 0.7rem;
        font-weight: bold;
      }

      .loading {
        text-align: center;
        color: cyan;
        padding: 12px;
        font-size: 0.7rem;
      }

      @media (max-width: 750px) {
        .app-wrap {
          flex-direction: column;
        }
        .leader-panel {
          min-width: 100%;
        }
        .question {
          font-size: 0.9rem;
        }
        .option-btn {
          padding: 10px 14px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrap">
      <div class="game-panel">
        <h1>👑 CEK SKOR BUZZER KAMU 👑</h1>
        <div class="sub">⚡+10 POIN SETIAP JAWABAN BENAR⚡</div>

        <div class="nama-wrapper">
          <input
            type="text"
            id="namaUser"
            class="nama-input"
            placeholder="Isi nama / nickname bebas"
            maxlength="30" />
          <button id="randomNamaBtn" class="btn-random">🎲 RANDOM</button>
        </div>

        <div class="indikator-soal" id="indikatorSoal">
          📌 Soal ke-1 dari 10
        </div>

        <div class="question-card">
          <div class="question" id="question">Memuat pertanyaan...</div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="score-badge">
          <span>🎯 TOTAL SKOR</span>
          <span id="scoreValue">0</span>
        </div>

        <div id="kategoriDisplay" class="kategori-badge">
          🔷 Belum selesai main 🔷
        </div>

        <div class="btn-group">
          <button id="nextBtn" class="btn btn-next">➡️ LANJUTKAN</button>
          <button id="restartBtn" class="btn btn-restart">🔄 ULANG GAME</button>
          <button id="kirimSkorBtn" class="btn btn-send" disabled>
            📤 KIRIM SKOR (Selesaikan 10 soal)
          </button>
        </div>
      </div>

      <div class="leader-panel">
        <h2>🏆 PAPAN BUZZER 🏆</h2>
        <div id="leaderArea"><div class="loading">Menarik data...</div></div>
        <div style="text-align: center; margin-top: 8px">
          <button id="refreshLeaderBtn" class="btn btn-refresh">
            🔄 REFRESH
          </button>
        </div>
        <div class="sub" style="margin-top: 10px">
          ✨ Kirim skor otomatis aktif setelah 10 soal ✨
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://sheetdb.io/api/v1/8j9zcfxbu9upo';

      const questionsRaw = [
        {
          q: 'Pemerintah menaikkan harga BBM, sikap paling tepat sebagai buzzer?',
          opt: [
            'Tetap mendukung kebijakan pemerintah demi kepentingan nasional',
            'Mengkritik kebijakan karena memberatkan rakyat kecil',
            'Memilih diam tidak berkomentar',
            'Membagikan informasi keliru tentang kenaikan BBM',
          ],
          answer: 0,
          buzz: 'BUZZER SEJATI! +10',
        },
        {
          q: 'Jalan di daerah tertinggal masih banyak rusak. Komentar Anda sebagai buzzer?',
          opt: [
            'Pemerintah memiliki rencana jangka panjang yang matang',
            'Ini bukti nyata kegagalan pembangunan',
            'Lebih baik fokus ke kota besar dulu',
            'Tidak perlu dibangun',
          ],
          answer: 0,
          buzz: 'LOYALITAS TINGGI! +10',
        },
        {
          q: 'Pejabat korupsi tapi masih menjabat. Sikap ideal buzzer?',
          opt: [
            'Menunggu proses hukum dan hormati praduga tak bersalah',
            'Langsung tuntut mundur',
            'Sebarkan meme dan gosip',
            'Korupsi hal biasa',
          ],
          answer: 0,
          buzz: 'SABAR & SETIA! +10',
        },
        {
          q: 'Program IKN menuai kritik soal anggaran. Komentar kamu?',
          opt: [
            'Proyek strategis jangka panjang demi pemerataan',
            'Anggaran terlalu besar, lebih baik untuk rakyat miskin',
            'Proyek gagal dari awal',
            'Tidak perlu menanggapi kritik',
          ],
          answer: 0,
          buzz: 'PRO PEMERINTAH! +10',
        },
        {
          q: 'Efisiensi anggaran di kementerian. Sikap tepat buzzer?',
          opt: [
            'Langkah tepat demi kemajuan negara',
            'Pemerintah tidak becus',
            'Efisiensi hambat program rakyat',
            'Protes karena tidak diajak',
          ],
          answer: 0,
          buzz: 'BUZZER HEBAT! +10',
        },
        {
          q: 'Angka kemiskinan masih tinggi. Komentar ideal buzzer?',
          opt: [
            'Program pengentasan berjalan bertahap',
            'Pemerintah tidak serius',
            'Data BPS tidak penting',
            'Kemiskinan tidak penting',
          ],
          answer: 0,
          buzz: 'TETAP SEMANGAT! +10',
        },
        {
          q: 'Investasi besar dari perusahaan asing. Tanggapan kamu?',
          opt: [
            'Bukti kepercayaan dunia pada pemerintahan sekarang',
            'Menguras sumber daya lokal',
            'Tidak jelas manfaatnya',
            'Tolak karena tidak pro dalam negeri',
          ],
          answer: 0,
          buzz: 'EKONOMI MENDING! +10',
        },
        {
          q: 'Menteri lamban respons krisis pangan. Komentar buzzer?',
          opt: [
            'Presiden sudah kasih arahan, kita tunggu',
            'Menteri harus diganti',
            'Tidak perlu menteri',
            'Krisis pangan hoax',
          ],
          answer: 0,
          buzz: 'BUZZER LANGKA! +10',
        },
        {
          q: 'APBN 2025 fokus infrastruktur & pertahanan. Reaksi Anda?',
          opt: [
            'Tepat sasaran untuk kemajuan Indonesia',
            'Harusnya untuk kesehatan rakyat',
            'Anggaran terlalu besar',
            'Tidak usah bangun apapun',
          ],
          answer: 0,
          buzz: 'SETIA! +10',
        },
        {
          q: 'Presiden instruksikan digitalisasi birokrasi. Komentar buzzer sejati?',
          opt: [
            'Langkah maju menuju Indonesia Emas!',
            'Efisiensi hanya di atas kertas',
            'Memberatkan PNS kecil',
            'Rakyat butuh sembako murah',
          ],
          answer: 0,
          buzz: 'SIAP BELA! +10',
        },
      ];

      function getKategori(score) {
        if (score >= 0 && score <= 20)
          return { nama: 'BUKAN BUZZER', icon: '🚫', warna: '#f44336' };
        if (score >= 30 && score <= 50)
          return { nama: 'BUZZER PEMULA', icon: '🌱', warna: '#ff9800' };
        if (score >= 60 && score <= 70)
          return { nama: 'BUZZER MENENGAH', icon: '⚡', warna: '#2196f3' };
        if (score >= 80 && score <= 100)
          return { nama: 'BUZZER FIX 🔥', icon: '🏆', warna: '#4caf50' };
        return { nama: 'Belum selesai', icon: '🔷', warna: '#ffd966' };
      }

      function generateRandomName() {
        const depan = [
          'BUZZER',
          'GENERAL',
          'BOCIL',
          'SATRIA',
          'RAJA',
          'GARUDA',
          'MERAH',
          'NUSANTARA',
          'KUAT',
          'SANTRI',
          'PEMBERANI',
          'WIJAYA',
          'KUSUMA',
        ];
        const belakang = [
          'SEJATI',
          'KAMPANYE',
          'SUPRA',
          'CECEP',
          'BUDI',
          'JOKO',
          'POLINDRA',
          'PERKASA',
          'TAMA',
          'GEMILANG',
          'PRATAMA',
        ];
        return `${depan[Math.floor(Math.random() * depan.length)]} ${belakang[Math.floor(Math.random() * belakang.length)]}`;
      }

      function shuffleOptions(q) {
        let opts = q.opt.map((opt, idx) => ({ opt, idx }));
        for (let i = opts.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return {
          question: q.q,
          opt: opts.map((o) => o.opt),
          answer: opts.findIndex((o) => o.idx === q.answer),
          buzz: q.buzz,
        };
      }

      let questions = [],
        currentIndex = 0,
        userScore = 0,
        answered = false,
        totalSoal = 10,
        gameCompleted = false;
      let isSending = false;

      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreSpan = document.getElementById('scoreValue');
      const namaInput = document.getElementById('namaUser');
      const indikatorEl = document.getElementById('indikatorSoal');
      const kategoriEl = document.getElementById('kategoriDisplay');
      const randomBtn = document.getElementById('randomNamaBtn');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');
      const kirimBtn = document.getElementById('kirimSkorBtn');
      const refreshLeaderBtn = document.getElementById('refreshLeaderBtn');
      const leaderArea = document.getElementById('leaderArea');

      randomBtn.onclick = () => (namaInput.value = generateRandomName());

      function updateKirimButton() {
        if (gameCompleted) {
          kirimBtn.disabled = false;
          kirimBtn.classList.add('btn-send-ready');
          kirimBtn.innerHTML = '✅ KIRIM SKOR (Siap dikirim!) ✅';
        } else {
          kirimBtn.disabled = true;
          kirimBtn.classList.remove('btn-send-ready');
          kirimBtn.innerHTML = '📤 KIRIM SKOR (Selesaikan 10 soal)';
        }
      }

      function updateKategori() {
        if (!gameCompleted && currentIndex < totalSoal - 1) {
          kategoriEl.innerHTML = `🔷 Belum selesai main (${currentIndex + 1}/${totalSoal}) 🔷`;
          return;
        }
        const kat = getKategori(userScore);
        kategoriEl.innerHTML = `${kat.icon} ${kat.nama} ${kat.icon}`;
        kategoriEl.style.color = kat.warna;
        if (gameCompleted) updateKirimButton();
      }

      function loadQuestion() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        const q = questions[currentIndex];
        questionEl.innerText = q.question;
        indikatorEl.innerText = `📌 Soal ke-${currentIndex + 1} dari ${totalSoal}`;
        optionsEl.innerHTML = '';
        q.opt.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => answerQuestion(idx);
          optionsEl.appendChild(btn);
        });
        updateKategori();
      }

      function answerQuestion(selected) {
        if (answered || gameCompleted) return;
        const q = questions[currentIndex];
        const benar = selected === q.answer;
        if (benar) {
          userScore += 10;
          scoreSpan.innerText = userScore;
          feedbackEl.innerHTML = `✅ ${q.buzz}! ✅`;
          feedbackEl.className = 'feedback benar';
        } else {
          const jawabanBenar = q.opt[q.answer];
          feedbackEl.innerHTML = `❌ SALAH! Jawaban: "${jawabanBenar}" ❌`;
          feedbackEl.className = 'feedback salah';
        }
        answered = true;
        document
          .querySelectorAll('.option-btn')
          .forEach((btn) => (btn.disabled = true));
        updateKategori();
      }

      function nextSoal() {
        if (gameCompleted) return;
        if (!answered) {
          Swal.fire({
            icon: 'warning',
            title: 'Belum dijawab!',
            text: 'Jawab dulu baru lanjut!',
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
          });
          return;
        }
        if (currentIndex + 1 < totalSoal) {
          currentIndex++;
          loadQuestion();
        } else {
          gameCompleted = true;
          const kat = getKategori(userScore);
          updateKategori();
          Swal.fire({
            icon: 'success',
            title: '🎉 10 SOAL SELESAI! 🎉',
            html: `<strong>${kat.icon} ${kat.nama}</strong><br>Skor: ${userScore}/${totalSoal * 10}<br><br>✅ Tombol KIRIM SKOR sudah aktif! ✅`,
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
          });
          feedbackEl.innerHTML = `🏁 SELESAI! SKOR: ${userScore}/${totalSoal * 10} | ${kat.nama} 🏁`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
          updateKirimButton();
        }
      }

      function restartGame() {
        currentIndex = 0;
        userScore = 0;
        answered = false;
        gameCompleted = false;
        isSending = false;
        scoreSpan.innerText = userScore;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        questions = questionsRaw.map((q) => shuffleOptions(q));
        loadQuestion();
        feedbackEl.innerHTML = '';
        updateKategori();
        updateKirimButton();
        kirimBtn.classList.remove('btn-send-ready');
        kirimBtn.disabled = true;
        kirimBtn.innerHTML = '📤 KIRIM SKOR (Selesaikan 10 soal)';
      }

      async function kirimSkorKeSheet() {
        if (isSending) {
          Swal.fire({
            icon: 'warning',
            title: 'Proses sedang berjalan!',
            text: 'Tunggu sebentar, jangan double klik!',
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
            timer: 2000,
          });
          return;
        }
        if (!gameCompleted) {
          Swal.fire({
            icon: 'warning',
            title: 'Belum selesai!',
            text: 'Selesaikan 10 soal dulu!',
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
          });
          return;
        }

        let nama = namaInput.value.trim();
        if (nama === '') {
          Swal.fire({
            icon: 'error',
            title: '⚠️ NAMA KOSONG! ⚠️',
            html: '<strong>Isi nama dulu ya!</strong><br>Klik tombol 🎲 RANDOM atau ketik sendiri.<br><br>Nama wajib diisi biar skor tercatat!',
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
          });
          return;
        }

        isSending = true;
        kirimBtn.disabled = true;
        kirimBtn.innerHTML = '📤 MENGIRIM...';

        const kat = getKategori(userScore);
        const data = {
          nama: nama,
          skor: userScore,
          tanggal: new Date().toLocaleString('id-ID'),
          kategori: kat.nama,
        };

        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            Swal.fire({
              icon: 'success',
              title: '✅ BERHASIL TERKIRIM! ✅',
              html: `🎉 <strong>${nama}</strong><br>${kat.icon} ${kat.nama}<br>Skor: <strong>${userScore}</strong><br><br>⚠️ Jangan kirim lagi ya!`,
              background: '#0a1022',
              color: '#FFD966',
              confirmButtonColor: '#FFB347',
            });
            refreshLeaderboard();
            kirimBtn.innerHTML = '✅ SUDAH TERKIRIM';
          } else throw new Error();
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'GAGAL!',
            text: 'Cek koneksi atau API',
            background: '#0a1022',
            color: '#FFD966',
            confirmButtonColor: '#FFB347',
          });
          kirimBtn.disabled = false;
          kirimBtn.innerHTML = '✅ KIRIM SKOR (Siap dikirim!)';
          isSending = false;
        }
      }

      async function refreshLeaderboard() {
        leaderArea.innerHTML =
          '<div class="loading">⏳ Mengambil data...</div>';
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          let list = data
            .filter((r) => r.nama && r.skor)
            .map((r) => ({ nama: r.nama, skor: parseInt(r.skor) || 0 }));
          list.sort((a, b) => b.skor - a.skor);
          leaderArea.innerHTML =
            list
              .slice(0, 10)
              .map(
                (item, idx) =>
                  `<div class="leader-item"><span class="rank">${idx + 1}.</span><span class="leader-name">${escapeHtml(item.nama)}</span><span class="leader-score">${item.skor}</span></div>`,
              )
              .join('') || '<div class="loading">Belum ada data</div>';
        } catch (e) {
          leaderArea.innerHTML = '<div class="loading">Gagal muat</div>';
        }
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>]/g,
          (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m],
        );
      }

      nextBtn.onclick = nextSoal;
      restartBtn.onclick = restartGame;
      kirimBtn.onclick = kirimSkorKeSheet;
      refreshLeaderBtn.onclick = refreshLeaderboard;

      questions = questionsRaw.map((q) => shuffleOptions(q));
      loadQuestion();
      refreshLeaderboard();
      updateKirimButton();
    </script>
  </body>
</html>
