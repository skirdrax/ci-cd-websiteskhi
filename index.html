<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🤡 SEBERAPA BUZZER KAMU?</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(
          circle at 10% 20%,
          rgb(0, 0, 0) 0%,
          rgb(30, 30, 60) 90%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', 'Segoe UI', system-ui, monospace;
        padding: 20px;
      }

      .game-box {
        background: rgba(15, 20, 35, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 60px;
        padding: 30px 25px;
        box-shadow:
          0 25px 45px rgba(0, 0, 0, 0.5),
          0 0 0 2px rgba(255, 215, 0, 0.2);
        text-align: center;
        max-width: 700px;
        width: 100%;
        transition: all 0.2s;
      }

      h1 {
        font-size: 2rem;
        background: linear-gradient(135deg, #ffd700, #ffb347);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        letter-spacing: 2px;
      }

      .sub {
        color: #c0c0c0;
        font-size: 0.85rem;
        margin-top: 8px;
        border-top: 1px dashed gold;
        display: inline-block;
        padding-top: 6px;
      }

      .question-card {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 48px;
        padding: 30px 20px;
        margin: 25px 0;
        border: 1px solid rgba(255, 215, 0, 0.5);
        box-shadow:
          inset 0 0 12px rgba(255, 215, 0, 0.1),
          0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .question {
        font-size: 1.5rem;
        font-weight: bold;
        color: #ffe484;
        margin-bottom: 28px;
        line-height: 1.3;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 10px;
      }

      .option-btn {
        background: rgba(0, 0, 0, 0.7);
        border: 1.5px solid #ffd966;
        padding: 14px 16px;
        border-radius: 100px;
        font-size: 1rem;
        font-weight: 600;
        color: #f8f3e0;
        cursor: pointer;
        transition: 0.2s;
        font-family: 'Segoe UI', monospace;
        backdrop-filter: blur(4px);
      }

      .option-btn:hover {
        transform: scale(1.01);
        background: #ffd700;
        color: #0a0f1e;
        border-color: white;
        box-shadow: 0 0 12px gold;
      }

      .feedback {
        font-size: 1rem;
        margin: 15px 0 5px;
        padding: 12px;
        border-radius: 40px;
        font-weight: bold;
      }

      .feedback.benar {
        background: #2e7d32;
        color: #ffffff;
        box-shadow: 0 0 6px #4caf50;
      }

      .feedback.salah {
        background: #b71c1c;
        color: #ffe0e0;
        box-shadow: 0 0 6px #f44336;
      }

      /* Panel skor + tombol - dipisah rapi */
      .score-panel {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 48px;
        padding: 12px 20px;
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        border: 1px solid rgba(255, 215, 0, 0.5);
      }

      .score-stats {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .score-item {
        font-size: 1.1rem;
        font-weight: bold;
        color: #ffd966;
        background: #0c0f1c;
        padding: 5px 18px;
        border-radius: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .score-item span {
        background: gold;
        color: #1a1f2e;
        padding: 3px 14px;
        border-radius: 30px;
        font-size: 1.2rem;
        font-weight: 800;
      }

      /* Tombol aksi dipisah dan dijauhkan */
      .action-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 12px;
      }

      .btn-next {
        background: linear-gradient(95deg, #ffb347, #ff8c00);
        border: none;
        padding: 10px 28px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
        color: #1e1e2a;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        font-family: monospace;
      }

      .btn-restart {
        background: rgba(30, 30, 60, 0.9);
        border: 1.5px solid #ffb347;
        padding: 10px 28px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
        color: #ffcd7e;
        font-family: monospace;
      }

      .btn-next:hover {
        transform: scale(1.03);
        background: #ffaa33;
        box-shadow: 0 0 12px orange;
      }

      .btn-restart:hover {
        background: #ffb347;
        color: #1e1e2a;
        border-color: white;
      }

      /* MODAL */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(5px);
        z-index: 2000;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: radial-gradient(circle at 30% 20%, #1e1b2c, #0b0d1a);
        border-radius: 48px;
        padding: 28px 22px;
        text-align: center;
        max-width: 340px;
        width: 85%;
        border: 2px solid gold;
        animation: naik 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      }

      .modal-content h3 {
        color: gold;
        font-size: 1.7rem;
        margin-bottom: 15px;
      }

      .modal-content p {
        color: #f0ede8;
        font-size: 1rem;
        margin-bottom: 20px;
      }

      .modal-content button {
        background: gold;
        border: none;
        padding: 10px 25px;
        border-radius: 60px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
      }

      @keyframes naik {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 550px) {
        .game-box {
          padding: 20px 16px;
        }
        .question {
          font-size: 1.2rem;
        }
        .option-btn {
          padding: 10px 12px;
          font-size: 0.8rem;
        }
        .score-item {
          font-size: 0.8rem;
          padding: 3px 10px;
        }
        .btn-next,
        .btn-restart {
          padding: 7px 18px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>🤡 SEBERAPA BUZZER KAMU?</h1>
      <div class="sub">✨ TEST LOYALITAS PRO PEMERINTAH ✨</div>

      <div class="question-card">
        <div class="question" id="question">Memuat soal...</div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="score-panel">
        <div class="score-stats">
          <div class="score-item">🎯 SKOR BUZZER <span id="score">0</span></div>
          <div class="score-item">
            📋 SOAL <span id="qNum">1</span>/<span id="total">8</span>
          </div>
        </div>
      </div>

      <!-- Tombol: Next di kiri, Restart di kanan - gak bakal salah pencet! -->
      <div class="action-buttons">
        <button id="nextBtn" class="btn-next">➡️ LANJUTKAN ⬅️</button>
        <button id="restartBtn" class="btn-restart">🔄 RESET & ULANG</button>
      </div>
    </div>

    <!-- Modal Popup jawaban -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <button onclick="closeModal()">OK, LANJUTKAN</button>
      </div>
    </div>

    <script>
      const questions = [
        {
          question: '📢 Pemerintah naikin harga bahan pokok, sikap kamu?',
          options: [
            '🇮🇩 TETAP DUKUNG! DEMI PEMBANGUNAN!',
            '🤫 DIAM SAJA... ntar dipanggil RT',
            '🤡 PROSES DULU, YANG PENTING TETAP SEMANGAT',
            '😤 KOK NAIK TERUS? KERJA KERAS RAKYAT',
          ],
          answer: 0,
          buzzWord: '🔥 BUZZER LEGEND! SIAP BELA KAPAN PUN! 🔥',
        },
        {
          question: '🛣️ Jalan rusak bertahun-tahun, kamu bilang?',
          options: [
            '🏗️ BUTUH WAKTU, APBN TERBATAS',
            '💪 PEMERINTAH PASTI ADA CARA',
            '🤬 PENGEN DEMO TAPI MAU MAKAN',
            '😎 YANG PENTING JALAN MASIH ADA',
          ],
          answer: 0,
          buzzWord: '🤝 TULENAN BUZZER! PANTANG MENYERAH! 🤝',
        },
        {
          question: '🗣️ Pejabat keliru ngomong di TV, reaksi kamu?',
          options: [
            '❤️ WAJAR MANUSIA, MALAH LUCU',
            '📢 MASIH LEBIH BAIK DARIPADA YG LAIN',
            '😂 BUAT MEME AJA SANTUY',
            '🤦 YANG PENTING BUKAN KORUPSI',
          ],
          answer: 0,
          buzzWord: '👑 BUZZER HEBAT! SABAR & SETIA 👑',
        },
        {
          question: '💰 Proyek negara molor & melebihi anggaran, kata kamu?',
          options: [
            '⚙️ DEMI KUALITAS DAN MASA DEPAN',
            '🙏 SEMOGA CEPAT RAMPUNG, DOAKAN SAJA',
            '🧠 PASTI ADA HIKMAHNYA',
            '😭 UANG RAKYAT KEMANA AJA?',
          ],
          answer: 0,
          buzzWord: '🧧 GOCAP! PEMERINTAH NO 1 🧧',
        },
        {
          question: '📉 Perekonomian lesu tapi stok pangan aman, reaksi?',
          options: [
            '🏆 PRESIDEN HEBAT, SWASEMBADA PANGAN',
            '💊 SABAR, EKONOMI LAGI PEMULIHAN',
            '📉 HARUS DIKEJAR LAGI KERJA KERAS',
            '🇮🇩 TAPI HARGA LAPANGAN TETAP MAHAL',
          ],
          answer: 0,
          buzzWord: '🇮🇩 BUZZER SEJATI! DUNIA KAGUM 🇮🇩',
        },
        {
          question: '👮‍♂️ Demonstrasi rakyat ditindak tegas?',
          options: [
            '✅ NEGARA BUTUH STABILITAS',
            '🤔 TERGANTUNG ESKALASI',
            '💔 HAM DIPERHATIKAN TAPI HUKUM TETAP JALAN',
            '😠 KURANG ADIL!',
          ],
          answer: 0,
          buzzWord:
            '🛡️ BUZZER SUPER! HUKUM TAJAM KE BAWAH TAPI INI DEMI KEAMANAN 🛡️',
        },
        {
          question: '📈 Iklan pemerintah terlalu banyak di TV, kamu?',
          options: [
            '📺 EDUKASI BANGSA, PENTING SEKALI',
            '😊 YANG PENTING KARYA ANAK BANGSA',
            '😴 DYOR TIDUR AJA',
            '🤯 APBN LUMBUYUNG ',
          ],
          answer: 0,
          buzzWord: '🎬 BUZZER POPULER! SERBU TERUS! 🎬',
        },
        {
          question: '🔁 Janji kampanye harus ditepati?',
          options: [
            '⏳ BUTUH PROSES, KERJA BERTAHAP',
            '🤝 PERCAYA SAMA PEMERINTAH',
            '💪 MASIH ADA WAKTU',
            '⚡ CEPETAN DONG!',
          ],
          answer: 0,
          buzzWord: '⏰ BUZZER SUKSES! SEMUA PASTI BAIK ⏰',
        },
      ];

      let currentIndex = 0,
        score = 0,
        answered = false,
        totalQ = questions.length;
      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreEl = document.getElementById('score');
      const qNumEl = document.getElementById('qNum');
      const totalEl = document.getElementById('total');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');
      const modal = document.getElementById('modal');
      const modalTitle = document.getElementById('modalTitle');
      const modalText = document.getElementById('modalText');

      totalEl.innerText = totalQ;

      function closeModal() {
        modal.style.display = 'none';
      }

      function tampilModal(judul, pesan) {
        modalTitle.innerText = judul;
        modalText.innerText = pesan;
        modal.style.display = 'flex';
      }

      function muatSoal() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        const q = questions[currentIndex];
        questionEl.innerText = q.question;
        optionsEl.innerHTML = '';
        q.options.forEach((opt, idx) => {
          const tombol = document.createElement('button');
          tombol.className = 'option-btn';
          tombol.innerText = opt;
          tombol.onclick = () => jawab(idx);
          optionsEl.appendChild(tombol);
        });
        qNumEl.innerText = currentIndex + 1;
      }

      function jawab(pilih) {
        if (answered) return;
        const soal = questions[currentIndex];
        const benar = pilih === soal.answer;

        if (benar) {
          score++;
          scoreEl.innerText = score;
          feedbackEl.innerHTML = '✅ BUZZER MANTAP! +1 POIN ✅';
          feedbackEl.className = 'feedback benar';
          tampilModal(
            '🎤 BUZZER BERKELAS 🎤',
            `${soal.buzzWord}\n✨ SKOR BUZZER ANDA NAIK! ✨`,
          );
        } else {
          const jawabanBenar = soal.options[soal.answer];
          feedbackEl.innerHTML = `❌ KURANG BUZZER! JAWABANNYA: "${jawabanBenar}" ❌`;
          feedbackEl.className = 'feedback salah';
          tampilModal(
            '❗ GAGAL BUZZER ❗',
            `Jawabannya harusnya: "${jawabanBenar}"\n${soal.buzzWord}`,
          );
        }
        answered = true;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn) => {
          btn.disabled = true;
          btn.style.opacity = '0.7';
        });
      }

      function lanjutSoal() {
        if (!answered) {
          feedbackEl.innerHTML = '⚠️ JAWAB DULU, BARU LANJUT! ⚠️';
          feedbackEl.className = 'feedback salah';
          return;
        }
        if (currentIndex + 1 < totalQ) {
          currentIndex++;
          muatSoal();
        } else {
          let gelar = '';
          let komen = '';
          if (score === totalQ) {
            gelar = '🏆 BUZZER LEGEND 🏆';
            komen = `GILA! SKOR ${score}/${totalQ} . KAMU BUZZER ASLI, SIAP DAPAT JATAH!`;
          } else if (score >= 5) {
            gelar = '🎙️ BUZZER KANDIDAT 🎙️';
            komen = `SKOR ${score}/${totalQ}. LUMATAN BANGET, NAIKIN LAGI LOYALITAS!`;
          } else {
            gelar = '😭 BUZZER ABAL 🥀';
            komen = `SKOR ${score}/${totalQ}. YAH KURANG PRO PEMERINTAH, BELAJAR LAGI!`;
          }
          feedbackEl.innerHTML = `🏁 ${gelar} | SKOR AKHIR: ${score}/${totalQ} 🏁`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
          tampilModal(gelar, komen);
        }
      }

      function resetGame() {
        currentIndex = 0;
        score = 0;
        answered = false;
        scoreEl.innerText = score;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        muatSoal();
        closeModal();
      }

      nextBtn.onclick = lanjutSoal;
      restartBtn.onclick = resetGame;
      muatSoal();
    </script>
  </body>
</html>
