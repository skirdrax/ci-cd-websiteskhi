<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🤡 SEBERAPA BUZZER KAMU? | SPREADSHEET</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
        font-family: 'Segoe UI', 'Poppins', monospace;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app-wrap {
        max-width: 1200px;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .game-panel {
        flex: 1.5;
        min-width: 320px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 48px;
        padding: 22px;
        border: 1px solid gold;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
      }

      .leader-panel {
        flex: 0.7;
        min-width: 260px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 40px;
        padding: 18px;
        border: 1px solid cyan;
      }

      h1 {
        font-size: 1.4rem;
        text-align: center;
        background: linear-gradient(135deg, gold, #ffb347);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
      }

      .sub {
        text-align: center;
        color: #aaa;
        margin-bottom: 12px;
        font-size: 0.65rem;
        letter-spacing: 1px;
      }

      h2 {
        color: cyan;
        font-size: 1rem;
        margin-bottom: 10px;
        text-align: center;
      }

      .nama-wrapper {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .nama-input {
        flex: 2;
        padding: 8px 12px;
        border-radius: 60px;
        border: 1px solid gold;
        background: #0a0f1e;
        color: white;
        font-size: 0.85rem;
        outline: none;
        font-weight: bold;
        text-align: center;
      }

      .btn-random {
        background: #2c3e66;
        border: 1px solid cyan;
        padding: 0 15px;
        border-radius: 60px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .indikator-soal {
        text-align: center;
        color: cyan;
        font-size: 0.7rem;
        margin-bottom: 10px;
        background: rgba(0, 0, 0, 0.5);
        display: inline-block;
        width: 100%;
        padding: 5px;
        border-radius: 30px;
      }

      .question-card {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 32px;
        padding: 16px;
        margin: 10px 0;
        border: 1px solid rgba(255, 215, 0, 0.4);
      }

      .question {
        font-size: 0.95rem;
        font-weight: bold;
        color: #ffe484;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .option-btn {
        background: #1e1e3a;
        border: 1px solid gold;
        padding: 8px 12px;
        border-radius: 60px;
        font-weight: bold;
        color: #f0f0f0;
        cursor: pointer;
        transition: 0.15s;
        font-size: 0.8rem;
        text-align: left;
      }

      .option-btn:hover:not(:disabled) {
        background: gold;
        color: black;
        transform: scale(1.01);
      }

      .option-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .feedback {
        margin-top: 10px;
        padding: 8px;
        border-radius: 40px;
        text-align: center;
        font-weight: bold;
        font-size: 0.8rem;
      }

      .feedback.benar {
        background: #1b5e2a;
        color: #e8f5e9;
      }

      .feedback.salah {
        background: #a51c30;
        color: #fff0f0;
      }

      .score-badge {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        background: #00000066;
        border-radius: 60px;
        padding: 5px 15px;
        margin: 10px 0 5px;
        flex-wrap: wrap;
      }

      .score-badge span {
        background: gold;
        padding: 2px 15px;
        border-radius: 60px;
        font-size: 1.1rem;
        font-weight: bold;
        color: black;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 7px 16px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.75rem;
      }

      .btn-next {
        background: linear-gradient(95deg, gold, #ffae42);
        color: #1e1e2a;
      }

      .btn-restart {
        background: #2a2a4a;
        border: 1px solid cyan;
        color: cyan;
      }

      .btn-send {
        background: #0f6b3a;
        border: 1px solid #25d865;
        color: white;
      }

      .btn-refresh {
        background: #005c99;
        border: 1px solid cyan;
        color: white;
      }

      .leader-list {
        max-height: 320px;
        overflow-y: auto;
        margin-top: 10px;
      }

      .leader-item {
        display: flex;
        justify-content: space-between;
        background: rgba(0, 255, 255, 0.1);
        margin: 5px 0;
        padding: 5px 10px;
        border-radius: 60px;
        border-left: 3px solid cyan;
        font-weight: bold;
        font-size: 0.75rem;
      }

      .rank {
        color: cyan;
        font-weight: bold;
      }

      .leader-name {
        color: #ffd966;
        text-transform: capitalize;
      }

      .leader-score {
        background: gold;
        padding: 2px 8px;
        border-radius: 40px;
        color: black;
        font-size: 0.7rem;
      }

      .loading {
        text-align: center;
        color: cyan;
        padding: 15px;
        font-size: 0.75rem;
      }

      @media (max-width: 750px) {
        .app-wrap {
          flex-direction: column;
        }
        .leader-panel {
          min-width: 100%;
        }
        .question {
          font-size: 0.85rem;
        }
        .option-btn {
          padding: 7px 10px;
          font-size: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrap">
      <div class="game-panel">
        <h1>🤡 BUZZER INDONESIA 🤡</h1>
        <div class="sub">SKOR AKAN TERKIRIM KE SPREADSHEET</div>

        <div class="nama-wrapper">
          <input
            type="text"
            id="namaUser"
            class="nama-input"
            placeholder="NAMA / NICKNAME"
            maxlength="30" />
          <button id="randomNamaBtn" class="btn-random">🎲 RANDOM</button>
        </div>

        <div class="indikator-soal" id="indikatorSoal">Soal ke-1 dari 10</div>

        <div class="question-card">
          <div class="question" id="question">Memuat pertanyaan...</div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="score-badge">
          <span>📢 SKOR BUZZER</span>
          <span id="scoreValue">0</span>
        </div>

        <div class="btn-group">
          <button id="nextBtn" class="btn btn-next">➡️ LANJUTKAN</button>
          <button id="restartBtn" class="btn btn-restart">🔄 ULANG GAME</button>
          <button id="kirimSkorBtn" class="btn btn-send">📤 KIRIM SKOR</button>
        </div>
      </div>

      <div class="leader-panel">
        <h2>🏆 PAPAN BUZZER 🏆</h2>
        <div id="leaderArea">
          <div class="loading">Menarik data...</div>
        </div>
        <div class="btn-group" style="margin-top: 12px">
          <button id="refreshLeaderBtn" class="btn btn-refresh">
            🔄 REFRESH
          </button>
        </div>
        <div class="sub" style="margin-top: 8px">
          Klik KIRIM SKOR setelah selesai main!
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://sheetdb.io/api/v1/8j9zcfxbu9upo';

      const questionsRaw = [
        {
          q: 'Pemerintah menaikkan harga Bahan Bakar Minyak (BBM), sikap paling tepat sebagai buzzer?',
          opt: [
            'Tetap mendukung kebijakan pemerintah demi kepentingan nasional',
            'Mengkritik kebijakan karena memberatkan rakyat kecil',
            'Memilih diam tidak berkomentar',
            'Membagikan informasi keliru tentang kenaikan BBM',
          ],
          answer: 0,
          buzz: 'BUZZER SEJATI! SETIA TERUS!',
        },
        {
          q: 'Kondisi infrastruktur jalan di daerah tertinggal masih banyak rusak. Sebagai buzzer andalan, komentar Anda?',
          opt: [
            'Pemerintah memiliki rencana jangka panjang yang matang',
            'Ini bukti nyata kegagalan pembangunan',
            'Lebih baik fokus ke infrastruktur kota besar dulu',
            'Tidak perlu dibangun karena tidak ada gunanya',
          ],
          answer: 0,
          buzz: 'LOYALITAS TINGGI! PRO PEMERINTAH!',
        },
        {
          q: 'Seorang pejabat tinggi terbukti melakukan korupsi, namun masih menjabat. Sikap ideal seorang buzzer?',
          opt: [
            'Menunggu proses hukum dan tetap menghormati asas praduga tak bersalah',
            'Langsung menuntut pejabat tersebut mundur dari jabatan',
            'Membagikan meme dan gosip tentang pejabat lain',
            'Menganggap korupsi adalah hal biasa',
          ],
          answer: 0,
          buzz: 'SABAR DAN SETIA! BUZZER KEREN!',
        },
        {
          q: 'Program pembangunan Ibu Kota Nusantara (IKN) menuai kritik soal anggaran. Komentar kamu sebagai buzzer?',
          opt: [
            'IKN adalah proyek strategis jangka panjang demi pemerataan',
            'Anggaran terlalu besar, lebih baik untuk rakyat miskin',
            'Proyek gagal dari awal karena tidak terencana',
            'Tidak perlu menanggapi kritik publik',
          ],
          answer: 0,
          buzz: 'PRO PEMERINTAH! MAJU TERUS!',
        },
        {
          q: 'Pemerintah melakukan efisiensi anggaran besar-besaran di kementerian. Sikap tepat seorang buzzer?',
          opt: [
            'Langkah tepat demi kemajuan dan efektivitas negara',
            'Pemerintah tidak becus mengelola keuangan',
            'Efisiensi hanya akan menghambat program rakyat',
            'Protes karena tidak diikutsertakan dalam musyawarah',
          ],
          answer: 0,
          buzz: 'BUZZER HEBAT! PANDAI MEMBELA KEBIJAKAN!',
        },
        {
          q: 'Angka kemiskinan masih cukup tinggi menurut data BPS. Komentar ideal sebagai buzzer andalan?',
          opt: [
            'Program pengentasan kemiskinan terus berjalan dan bertahap',
            'Ini bukti pemerintah tidak serius mengatasi kemiskinan',
            'Yang penting data BPS akurat dan bisa dipercaya',
            'Kemiskinan tidak penting, yang terpenting stabilitas',
          ],
          answer: 0,
          buzz: 'BUZZER MANTAAP! TETAP SEMANGAT!',
        },
        {
          q: 'Indonesia mendapat investasi besar dari perusahaan asing. Tanggapan paling mendukung sebagai buzzer?',
          opt: [
            'Investasi ini bukti kepercayaan dunia pada pemerintahan sekarang',
            'Investasi hanya akan menguras sumber daya lokal',
            'Tidak jelas manfaatnya bagi rakyat kecil',
            'Minta pemerintah menolak karena tidak pro dalam negeri',
          ],
          answer: 0,
          buzz: 'BUZZER NO 1! EKONOMI MENDING!',
        },
        {
          q: 'Menteri dianggap lamban merespons krisis pangan. Buzzer yang baik akan berkomentar?',
          opt: [
            'Presiden telah memberi arahan dan kita tunggu hasilnya',
            'Menteri harus segera diganti karena tidak kompeten',
            'Tidak perlu ada menteri, presiden bisa langsung bertindak',
            'Krisis pangan hanyalah hoax dari lawan politik',
          ],
          answer: 0,
          buzz: 'SABAR ADALAH EMAS! BUZZER LANGKA!',
        },
        {
          q: 'APBN 2025 difokuskan pada pembangunan infrastruktur dan pertahanan. Reaksi Anda?',
          opt: [
            'Anggaran yang tepat sasaran untuk kemajuan Indonesia',
            'Seharusnya untuk ketahanan pangan dan kesehatan rakyat',
            'Anggaran terlalu besar, harus dipangkas habis',
            'Tidak usah bangun apapun, semua gratiskan',
          ],
          answer: 0,
          buzz: 'SETIA WALAU DIPUTAR! BUZZER!',
        },
        {
          q: 'Presiden memberi arahan soal efisiensi dan digitalisasi birokrasi. Komentar seorang buzzer sejati?',
          opt: [
            'Langkah maju menuju Indonesia Emas 2045. Presiden luar biasa!',
            'Efisiensi hanya di atas kertas, realitanya sulit',
            'Digitalisasi hanya akan memberatkan PNS kecil',
            'Tidak penting, rakyat butuh sembako murah',
          ],
          answer: 0,
          buzz: 'BUZZER LEGENDARIS! SIAP BELA!',
        },
      ];

      function shuffleOptions(q) {
        let optionsWithIndex = q.opt.map((opt, idx) => ({ opt, idx }));
        for (let i = optionsWithIndex.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [optionsWithIndex[i], optionsWithIndex[j]] = [
            optionsWithIndex[j],
            optionsWithIndex[i],
          ];
        }
        let shuffledOpt = optionsWithIndex.map((item) => item.opt);
        let newAnswerIndex = optionsWithIndex.findIndex(
          (item) => item.idx === q.answer,
        );
        return {
          question: q.q,
          opt: shuffledOpt,
          answer: newAnswerIndex,
          buzz: q.buzz,
        };
      }

      let questions = [];
      let currentIndex = 0,
        userScore = 0,
        answered = false,
        totalSoal = 10;

      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreSpan = document.getElementById('scoreValue');
      const namaInput = document.getElementById('namaUser');
      const indikatorEl = document.getElementById('indikatorSoal');
      const randomBtn = document.getElementById('randomNamaBtn');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');
      const kirimBtn = document.getElementById('kirimSkorBtn');
      const refreshLeaderBtn = document.getElementById('refreshLeaderBtn');
      const leaderArea = document.getElementById('leaderArea');

      function generateRandomName() {
        const depan = [
          'BUZZER',
          'GENERAL',
          'BOCIL',
          'SATRIA',
          'RAJA',
          'GARUDA',
          'MERAH',
          'NUSANTARA',
          'KUAT',
          'SANTRI',
          'PEMBERANI',
          'TANGGUH',
        ];
        const belakang = [
          'SEJATI',
          'KAMPANYE',
          'SUPRA',
          'CECEP',
          'BUDI',
          'JOKO',
          'POLINDRA',
          'WIJAYA',
          'PERKASA',
          'TAMA',
          'GEMILANG',
        ];
        const rand1 = Math.floor(Math.random() * depan.length);
        const rand2 = Math.floor(Math.random() * belakang.length);
        return `${depan[rand1]} ${belakang[rand2]}${Math.floor(Math.random() * 99)}`;
      }

      randomBtn.onclick = () => {
        namaInput.value = generateRandomName();
      };

      function loadQuestion() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        const q = questions[currentIndex];
        questionEl.innerText = q.question;
        indikatorEl.innerText = `Soal ke-${currentIndex + 1} dari ${totalSoal}`;
        optionsEl.innerHTML = '';
        q.opt.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => answerQuestion(idx);
          optionsEl.appendChild(btn);
        });
      }

      function answerQuestion(selected) {
        if (answered) return;
        const q = questions[currentIndex];
        const benar = selected === q.answer;
        if (benar) {
          userScore += 10;
          scoreSpan.innerText = userScore;
          feedbackEl.innerHTML = `✅ ${q.buzz} +10 POIN! ✅`;
          feedbackEl.className = 'feedback benar';
        } else {
          const jawabanBenar = q.opt[q.answer];
          feedbackEl.innerHTML = `❌ SALAH! JAWABAN BUZZER: "${jawabanBenar}" ❌ ${q.buzz}`;
          feedbackEl.className = 'feedback salah';
        }
        answered = true;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn) => (btn.disabled = true));
      }

      function nextSoal() {
        if (!answered) {
          Swal.fire({
            icon: 'warning',
            title: 'Belum dijawab!',
            text: 'Jawab dulu soalnya sebelum lanjut ya buzzer!',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          return;
        }
        if (currentIndex + 1 < totalSoal) {
          currentIndex++;
          loadQuestion();
        } else {
          Swal.fire({
            icon: 'success',
            title: 'GAME SELESAI!',
            text: `Skor buzzer kamu: ${userScore}/${totalSoal * 10}`,
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          feedbackEl.innerHTML = `🏁 GAME SELESAI! SKOR BUZZER: ${userScore}/${totalSoal * 10} 🏁`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
        }
      }

      function restartGame() {
        currentIndex = 0;
        userScore = 0;
        answered = false;
        scoreSpan.innerText = userScore;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        questions = questionsRaw.map((q) => shuffleOptions(q));
        loadQuestion();
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
      }

      async function kirimSkorKeSheet() {
        let nama = namaInput.value.trim();
        if (nama === '') {
          Swal.fire({
            icon: 'error',
            title: 'Nama kosong!',
            text: 'Isi nama dulu (klik RANDOM atau ketik manual)',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          return;
        }
        const tanggal = new Date().toLocaleString('id-ID');
        const data = { nama: nama, skor: userScore, tanggal: tanggal };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (response.ok) {
            Swal.fire({
              icon: 'success',
              title: 'BERHASIL!',
              text: `Skor ${userScore} atas nama ${nama} berhasil dikirim ke Spreadsheet!`,
              background: '#1e1e3a',
              color: '#ffd966',
              confirmButtonColor: '#ffae42',
            });
            refreshLeaderboard();
          } else {
            Swal.fire({
              icon: 'error',
              title: 'GAGAL!',
              text: 'Gagal kirim skor. Cek API / izin sheets.',
              background: '#1e1e3a',
              color: '#ffd966',
              confirmButtonColor: '#ffae42',
            });
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'ERROR!',
            text: 'Jaringan bermasalah atau API tidak merespon.',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
        }
      }

      async function refreshLeaderboard() {
        leaderArea.innerHTML = '<div class="loading">Mengambil data...</div>';
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            let list = data
              .filter((row) => row.nama && row.skor)
              .map((row) => ({
                nama: row.nama,
                skor: parseInt(row.skor) || 0,
              }));
            list.sort((a, b) => b.skor - a.skor);
            if (list.length === 0) throw new Error();
            leaderArea.innerHTML = list
              .slice(0, 15)
              .map(
                (item, idx) => `
                    <div class="leader-item">
                        <span class="rank">${idx + 1}.</span>
                        <span class="leader-name">${escapeHtml(item.nama)}</span>
                        <span class="leader-score">${item.skor}</span>
                    </div>
                `,
              )
              .join('');
          } else {
            leaderArea.innerHTML =
              '<div class="loading">Belum ada data. Kirim skor dulu!</div>';
          }
        } catch (e) {
          leaderArea.innerHTML =
            '<div class="loading">Gagal muat leaderboard</div>';
        }
      }

      function escapeHtml(str) {
        return str.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      nextBtn.onclick = nextSoal;
      restartBtn.onclick = restartGame;
      kirimBtn.onclick = kirimSkorKeSheet;
      refreshLeaderBtn.onclick = refreshLeaderboard;

      if (namaInput.value === '') {
        namaInput.value = generateRandomName();
      }
      questions = questionsRaw.map((q) => shuffleOptions(q));
      loadQuestion();
      refreshLeaderboard();
    </script>
  </body>
</html>
