<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🎮 3 GAME SERU | Arcade Hub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <h1 class="game-title">✨ ARCADE HUB ✨</h1>

      <div class="game-menu">
        <button class="game-btn" data-game="catcher">
          <span class="btn-icon">🐱</span>
          <span>CATCHER</span>
        </button>
        <button class="game-btn" data-game="clicker">
          <span class="btn-icon">💥</span>
          <span>CLICKER</span>
        </button>
        <button class="game-btn" data-game="runner">
          <span class="btn-icon">🏃</span>
          <span>RUNNER</span>
        </button>
      </div>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
      </div>

      <div class="info" id="gameInfo">
        🖱️ Geser mousei / sentuh untuk bermain
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
