<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🧠 TEKA-TEKI LUCU | Asah Otak</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', monospace;
        padding: 16px;
      }

      .game-box {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 40px;
        padding: 25px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 550px;
        width: 100%;
      }

      h1 {
        font-size: 1.8rem;
        color: #1e3c72;
        margin-bottom: 10px;
      }

      .question-box {
        background: #f0f0f0;
        border-radius: 30px;
        padding: 30px;
        margin: 20px 0;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .question {
        font-size: 1.5rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 20px;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .option-btn {
        background: #2a5298;
        border: none;
        padding: 12px 20px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: bold;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        font-family: monospace;
      }

      .option-btn:hover {
        transform: scale(1.02);
        background: #1e3c72;
      }

      .option-btn.disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      .feedback {
        font-size: 1.2rem;
        margin: 15px 0;
        padding: 10px;
        border-radius: 30px;
      }

      .feedback.benar {
        background: #4caf50;
        color: white;
      }

      .feedback.salah {
        background: #f44336;
        color: white;
      }

      .score-box {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-top: 20px;
        padding: 15px;
        background: #1e3c72;
        border-radius: 50px;
        color: white;
        flex-wrap: wrap;
        justify-content: center;
      }

      .score-item {
        font-size: 1.2rem;
        font-weight: bold;
      }

      .score-item span {
        background: gold;
        color: #1e3c72;
        padding: 5px 15px;
        border-radius: 30px;
        margin-left: 8px;
      }

      button {
        background: #ffd700;
        border: none;
        padding: 10px 25px;
        border-radius: 40px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        transform: scale(1.05);
        background: #ffa500;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.3rem;
        }
        .question {
          font-size: 1.1rem;
        }
        .option-btn {
          padding: 8px 15px;
          font-size: 0.8rem;
        }
        .score-item {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>🧠 TEKA-TEKI LUCU 🧠</h1>
      <div class="question-box">
        <div class="question" id="question">...</div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>
      <div class="score-box">
        <div class="score-item">🎯 SKOR: <span id="score">0</span></div>
        <div class="score-item">
          📊 NOMOR: <span id="qNum">1</span>/<span id="total">10</span>
        </div>
        <button id="nextBtn">➡️ SOAL BERIKUTNYA</button>
        <button id="restartBtn">🔄 ULANG</button>
      </div>
    </div>

    <script>
      const questions = [
        {
          question: 'Apa yang bisa naik tapi tidak bisa turun?',
          options: ['Usia', 'Pohon', 'Burung', 'Tangga'],
          answer: 0,
        },
        {
          question: 'Semakin banyak diambil, semakin besar jadinya. Apa itu?',
          options: ['Lubang', 'Utang', 'Nafsu', 'Harta'],
          answer: 0,
        },
        {
          question:
            'Apa yang selalu ada di depan tapi tak pernah bisa dilihat?',
          options: ['Bayangan', 'Masa depan', 'Cermin', 'Mata'],
          answer: 1,
        },
        {
          question: 'Benda apa yang kalau diputar malah jadi panjang?',
          options: ['Pensil', 'Rambut', 'Kaset', 'Kunci'],
          answer: 2,
        },
        {
          question: 'Apa yang bisa kamu pegang tapi tidak bisa kamu sentuh?',
          options: ['Hati', 'Bola', 'Air', 'Angin'],
          answer: 0,
        },
        {
          question: 'Apa huruf ke-5 dalam alfabet?',
          options: ['D', 'E', 'F', 'G'],
          answer: 1,
        },
        {
          question: 'Makin banyak kamu ambil, makin besar itu. Apa?',
          options: ['Lubang', 'Kue', 'Nasi', 'Air'],
          answer: 0,
        },
        {
          question: 'Apa yang tidak bisa basah meski terkena air?',
          options: ['Batu', 'Bayangan', 'Api', 'Es'],
          answer: 1,
        },
        {
          question: 'Apa yang punya leher tapi tidak punya kepala?',
          options: ['Botol', 'Baju', 'Pintu', 'Gitar'],
          answer: 3,
        },
        {
          question: 'Apa yang selalu jatuh tapi tidak pernah luka?',
          options: ['Daun', 'Hujan', 'Malam', 'Salju'],
          answer: 1,
        },
      ];

      let currentIndex = 0;
      let score = 0;
      let answered = false;
      let totalQuestions = questions.length;

      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreEl = document.getElementById('score');
      const qNumEl = document.getElementById('qNum');
      const totalEl = document.getElementById('total');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');

      totalEl.innerText = totalQuestions;

      function loadQuestion() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';

        const q = questions[currentIndex];
        questionEl.innerText = q.question;

        optionsEl.innerHTML = '';
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => checkAnswer(idx);
          optionsEl.appendChild(btn);
        });

        qNumEl.innerText = currentIndex + 1;
      }

      function checkAnswer(selected) {
        if (answered) return;

        const q = questions[currentIndex];
        const isCorrect = selected === q.answer;

        if (isCorrect) {
          score++;
          scoreEl.innerText = score;
          feedbackEl.innerHTML = '✅ BENAR! +1 poin ✅';
          feedbackEl.className = 'feedback benar';
        } else {
          const jawabanBenar = q.options[q.answer];
          feedbackEl.innerHTML = `❌ SALAH! Jawaban: ${jawabanBenar} ❌`;
          feedbackEl.className = 'feedback salah';
        }

        answered = true;

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach((btn) => {
          btn.disabled = true;
          btn.style.opacity = '0.6';
        });
      }

      function nextQuestion() {
        if (!answered) {
          feedbackEl.innerHTML = '⚠️ Jawab dulu soalnya! ⚠️';
          feedbackEl.className = 'feedback salah';
          return;
        }

        if (currentIndex + 1 < totalQuestions) {
          currentIndex++;
          loadQuestion();
        } else {
          feedbackEl.innerHTML = `🏆 SELESAI! Skor akhir: ${score}/${totalQuestions} 🏆`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
        }
      }

      function restartGame() {
        currentIndex = 0;
        score = 0;
        answered = false;
        scoreEl.innerText = score;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        loadQuestion();
      }

      nextBtn.onclick = nextQuestion;
      restartBtn.onclick = restartGame;

      loadQuestion();
    </script>
  </body>
</html>
