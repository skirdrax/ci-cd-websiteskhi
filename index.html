<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🤡 SEBERAPA BUZZER KAMU? | PAKAI SPREADSHEET</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
        font-family: 'Segoe UI', 'Poppins', monospace;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app-wrap {
        max-width: 1300px;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: center;
      }

      .game-panel {
        flex: 1.4;
        min-width: 340px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 48px;
        padding: 25px;
        border: 1px solid gold;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
      }

      .leader-panel {
        flex: 1;
        min-width: 300px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 48px;
        padding: 25px;
        border: 1px solid cyan;
      }

      h1 {
        font-size: 1.7rem;
        text-align: center;
        background: linear-gradient(135deg, gold, #ffb347);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 10px;
      }

      .sub {
        text-align: center;
        color: #aaa;
        margin-bottom: 18px;
        font-size: 0.75rem;
        letter-spacing: 1px;
      }

      h2 {
        color: cyan;
        font-size: 1.3rem;
        margin-bottom: 15px;
        text-align: center;
      }

      .nama-wrapper {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .nama-input {
        flex: 2;
        padding: 12px 16px;
        border-radius: 60px;
        border: 1px solid gold;
        background: #0a0f1e;
        color: white;
        font-size: 1rem;
        outline: none;
        font-weight: bold;
        text-align: center;
      }

      .btn-random {
        background: #2c3e66;
        border: 1px solid cyan;
        padding: 0 18px;
        border-radius: 60px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .question-card {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 32px;
        padding: 20px;
        margin: 15px 0;
        border: 1px solid rgba(255, 215, 0, 0.4);
      }

      .question {
        font-size: 1.2rem;
        font-weight: bold;
        color: #ffe484;
        margin-bottom: 20px;
        line-height: 1.4;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .option-btn {
        background: #1e1e3a;
        border: 1px solid gold;
        padding: 12px 16px;
        border-radius: 60px;
        font-weight: bold;
        color: #f0f0f0;
        cursor: pointer;
        transition: 0.15s;
      }

      .option-btn:hover:not(:disabled) {
        background: gold;
        color: black;
        transform: scale(1.01);
      }

      .option-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .feedback {
        margin-top: 15px;
        padding: 12px;
        border-radius: 40px;
        text-align: center;
        font-weight: bold;
      }

      .feedback.benar {
        background: #1b5e2a;
        color: #e8f5e9;
      }

      .feedback.salah {
        background: #a51c30;
        color: #fff0f0;
      }

      .score-badge {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 15px;
        background: #00000066;
        border-radius: 60px;
        padding: 8px 18px;
        margin: 15px 0 5px;
        flex-wrap: wrap;
      }

      .score-badge span {
        background: gold;
        padding: 4px 18px;
        border-radius: 60px;
        font-size: 1.4rem;
        font-weight: bold;
        color: black;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 15px;
      }

      .btn {
        border: none;
        padding: 10px 25px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.9rem;
      }

      .btn-next {
        background: linear-gradient(95deg, gold, #ffae42);
        color: #1e1e2a;
      }

      .btn-restart {
        background: #2a2a4a;
        border: 1px solid cyan;
        color: cyan;
      }

      .btn-send {
        background: #0f6b3a;
        border: 1px solid #25d865;
        color: white;
      }

      .btn-refresh {
        background: #005c99;
        border: 1px solid cyan;
        color: white;
      }

      .leader-list {
        max-height: 400px;
        overflow-y: auto;
        margin-top: 15px;
      }

      .leader-item {
        display: flex;
        justify-content: space-between;
        background: rgba(0, 255, 255, 0.1);
        margin: 8px 0;
        padding: 10px 15px;
        border-radius: 60px;
        border-left: 4px solid cyan;
        font-weight: bold;
      }

      .rank {
        color: cyan;
        font-weight: bold;
      }

      .leader-name {
        color: #ffd966;
        text-transform: capitalize;
      }

      .leader-score {
        background: gold;
        padding: 2px 12px;
        border-radius: 40px;
        color: black;
      }

      .loading {
        text-align: center;
        color: cyan;
        padding: 20px;
      }

      @media (max-width: 750px) {
        .app-wrap {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrap">
      <!-- GAME SECTION -->
      <div class="game-panel">
        <h1>🤡 BUZZER INDONESIA 🤡</h1>
        <div class="sub">🔊 SKOR LO AKAN TERKIRIM KE SPREADSHEET</div>

        <div class="nama-wrapper">
          <input
            type="text"
            id="namaUser"
            class="nama-input"
            placeholder="MASUKIN NAMA RANDOM / NICKNAME"
            maxlength="30" />
          <button id="randomNamaBtn" class="btn-random">🎲 RANDOM</button>
        </div>

        <div class="question-card">
          <div class="question" id="question">Memuat pertanyaan...</div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="score-badge">
          <span>📢 SKOR BUZZER</span>
          <span id="scoreValue">0</span>
        </div>

        <div class="btn-group">
          <button id="nextBtn" class="btn btn-next">➡️ LANJUTKAN</button>
          <button id="restartBtn" class="btn btn-restart">🔄 ULANG GAME</button>
          <button id="kirimSkorBtn" class="btn btn-send">
            📤 KIRIM SKOR KE SHEET
          </button>
        </div>
      </div>

      <!-- LEADERBOARD SECTION (tanpa tombol buka spreadsheet) -->
      <div class="leader-panel">
        <h2>📊 🏆 PAPAN BUZZER 🏆</h2>
        <div id="leaderArea">
          <div class="loading">📡 Menarik data dari Spreadsheet...</div>
        </div>
        <div class="btn-group" style="margin-top: 20px">
          <button id="refreshLeaderBtn" class="btn btn-refresh">
            🔄 REFRESH LEADERBOARD
          </button>
        </div>
        <div class="sub" style="margin-top: 12px">
          📌 Klik KIRIM SKOR setelah selesai main! Data langsung masuk
          spreadsheet.
        </div>
      </div>
    </div>

    <script>
      // ======================= 🔧 API URL (SUDAH PAKE PUNYA LO) =======================
      const API_URL = 'https://sheetdb.io/api/v1/8j9zcfxbu9upo';

      // ======================= SOAL BUZZER =======================
      const questions = [
        {
          q: '📢 Pemerintah naikin harga BBM, sikap kamu?',
          opt: [
            '🇮🇩 TETAP DUKUNG! DEMI RAKYAT',
            '😤 KOK NAIK TERUS? KERJA KERAS RAKYAT',
            '🤫 DIAM AJA TAKUT KENA PASAL',
            '🤡 PROSES DULU YANG PENTING SETIA',
          ],
          answer: 0,
          buzz: 'BUZZER SEJATI! +10 🔥',
        },
        {
          q: '🛣️ Jalan rusak bertahun-tahun, kata kamu?',
          opt: [
            '🏗️ BUTUH WAKTU / APBN TERBATAS',
            '🤬 PENGEN DEMO TAPI MAU MAKAN',
            '💪 PEMERINTAH PASTI BISA',
            '😎 YANG PENTING ADA JALAN',
          ],
          answer: 0,
          buzz: 'BUZZER! LOYALITAS TINGGI 💰',
        },
        {
          q: '🗣️ Pejabat salah ngomong di TV, reaksi kamu?',
          opt: [
            '❤️ WAJAR MANUSIA, MALAH LUCU',
            '😂 BUAT MEME AJA',
            '📢 MASIH LEBIH BAIK DARIPADA YG LAIN',
            '🤦 YANG PENTING BUKAN KORUPSI',
          ],
          answer: 0,
          buzz: 'BUZZER KEREN! SABAR 👑',
        },
        {
          q: '💰 Proyek negara molor & over budget, pendapatmu?',
          opt: [
            '⚙️ DEMI KUALITAS MASA DEPAN',
            '🙏 DOAKAN CEPAT RAMPUNG',
            '🧠 PASTI ADA HIKMAH',
            '😭 UANG RAKYAT KEMANA?',
          ],
          answer: 0,
          buzz: 'BUZZER HEBAT! PRO PEMERINTAH 🇮🇩',
        },
        {
          q: '📉 Ekonomi lesu tapi stok pangan aman, kata lo?',
          opt: [
            '🏆 SWASEMBADA PANGAN PRESIDEN HEBAT',
            '💊 SABAR EKONOMI PEMULIHAN',
            '📉 HARUS DIKEJAR LAGI',
            '🇮🇩 HARGA LAPANGAN TETAP MAHAL',
          ],
          answer: 0,
          buzz: 'BUZZER MANTAP! +10 🚀',
        },
        {
          q: '👮‍♂️ Demo rakyat ditindak tegas menurut buzzer?',
          opt: [
            '✅ NEGARA BUTUH STABILITAS',
            '😠 KURANG ADIL SIH',
            '🤔 TERGANTUNG ESKALASI',
            '💔 HAM DIPERHATIKAN TAPI HUKUM JALAN',
          ],
          answer: 0,
          buzz: 'BUZZER NO 1! KEAMANAN 🛡️',
        },
        {
          q: '📺 Iklan pemerintah terlalu banyak di TV, kamu?',
          opt: [
            '📢 PENTING BANGET UNTUK EDUKASI',
            '😊 YANG PENTING KARYA ANAK BANGSA',
            '😴 GAK PEDULI',
            '🤯 APBN LUMBUYUNG',
          ],
          answer: 0,
          buzz: 'BUZZER SETIA! +10 👏',
        },
        {
          q: '⚡ Janji kampanye saat ini harus?',
          opt: [
            '⏳ BUTUH PROSES BERTAHAP',
            '🤮 JANJI MANIS DOANG',
            '💪 MASIH BANYAK WAKTU',
            '🔥 CEPETAN DONG',
          ],
          answer: 0,
          buzz: 'BUZZER LEGEND! SABAR YA RAKYAT!',
        },
      ];

      let currentIndex = 0,
        userScore = 0,
        answered = false,
        totalSoal = questions.length;

      // DOM elements
      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreSpan = document.getElementById('scoreValue');
      const namaInput = document.getElementById('namaUser');
      const randomBtn = document.getElementById('randomNamaBtn');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');
      const kirimBtn = document.getElementById('kirimSkorBtn');
      const refreshLeaderBtn = document.getElementById('refreshLeaderBtn');
      const leaderArea = document.getElementById('leaderArea');

      // Random nama
      function generateRandomName() {
        const depan = [
          'BUZZER',
          'GENERAL',
          'BOCIL',
          'SATRIA',
          'RAJA',
          'GARUDA',
          'MERAH',
          'NUSANTARA',
          'KUAT',
          'SANTRI',
        ];
        const belakang = [
          'SEJATI',
          'KAMPANYE',
          'SUPRA',
          'CECEP',
          'BUDI',
          'JOKO',
          'POLINDRA',
          'WIJAYA',
          'PERKASA',
        ];
        const rand1 = Math.floor(Math.random() * depan.length);
        const rand2 = Math.floor(Math.random() * belakang.length);
        return `${depan[rand1]} ${belakang[rand2]}${Math.floor(Math.random() * 99)}`;
      }

      randomBtn.onclick = () => {
        let namaRandom = generateRandomName();
        namaInput.value = namaRandom;
      };

      // Load soal
      function loadQuestion() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        const q = questions[currentIndex];
        questionEl.innerText = q.q;
        optionsEl.innerHTML = '';
        q.opt.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => answerQuestion(idx);
          optionsEl.appendChild(btn);
        });
      }

      function answerQuestion(selected) {
        if (answered) return;
        const q = questions[currentIndex];
        const benar = selected === q.answer;
        if (benar) {
          userScore += 10;
          scoreSpan.innerText = userScore;
          feedbackEl.innerHTML = `✅ ${q.buzz} +10 POIN! ✅`;
          feedbackEl.className = 'feedback benar';
        } else {
          const jawabanBenar = q.opt[q.answer];
          feedbackEl.innerHTML = `❌ SALAH! JAWABAN BUZZER: "${jawabanBenar}" ❌ ${q.buzz}`;
          feedbackEl.className = 'feedback salah';
        }
        answered = true;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn) => (btn.disabled = true));
      }

      function nextSoal() {
        if (!answered) {
          feedbackEl.innerHTML = '⚠️ JAWAB DULU BARU LANJUT! ⚠️';
          feedbackEl.className = 'feedback salah';
          return;
        }
        if (currentIndex + 1 < totalSoal) {
          currentIndex++;
          loadQuestion();
        } else {
          feedbackEl.innerHTML = `🏁 GAME SELESAI! SKOR BUZZER: ${userScore}/${totalSoal * 10} 🏁`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
        }
      }

      function restartGame() {
        currentIndex = 0;
        userScore = 0;
        answered = false;
        scoreSpan.innerText = userScore;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        loadQuestion();
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
      }

      // Kirim skor ke SheetDB
      async function kirimSkorKeSheet() {
        let nama = namaInput.value.trim();
        if (nama === '') {
          alert('🚨 ISI NAMA DULU (klik RANDOM atau ketik) !!');
          return;
        }
        const tanggal = new Date().toLocaleString('id-ID');
        const data = { nama: nama, skor: userScore, tanggal: tanggal };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (response.ok) {
            alert(
              `✅ SKOR ${userScore} TERKIRIM! NAMA: ${nama} masuk Spreadsheet.`,
            );
            refreshLeaderboard();
          } else {
            alert('❌ Gagal kirim, cek API / izin sheets.');
          }
        } catch (err) {
          console.error(err);
          alert('🔴 Error jaringan / API');
        }
      }

      // Refresh leaderboard dari SheetDB
      async function refreshLeaderboard() {
        leaderArea.innerHTML =
          '<div class="loading">⏳ Mengambil data dari spreadsheet...</div>';
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            let list = data
              .filter((row) => row.nama && row.skor)
              .map((row) => ({
                nama: row.nama,
                skor: parseInt(row.skor) || 0,
              }));
            list.sort((a, b) => b.skor - a.skor);
            if (list.length === 0) throw new Error();
            leaderArea.innerHTML = list
              .slice(0, 20)
              .map(
                (item, idx) => `
                    <div class="leader-item">
                        <span class="rank">${idx + 1}.</span>
                        <span class="leader-name">${escapeHtml(item.nama)}</span>
                        <span class="leader-score">${item.skor} pts</span>
                    </div>
                `,
              )
              .join('');
          } else {
            leaderArea.innerHTML =
              '<div class="loading">📭 Belum ada data. Klik "KIRIM SKOR" dulu!</div>';
          }
        } catch (e) {
          leaderArea.innerHTML =
            '<div class="loading">❌ Gagal muat leaderboard, cek API/Sheet.</div>';
        }
      }

      function escapeHtml(str) {
        return str.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      // Event binding
      nextBtn.onclick = nextSoal;
      restartBtn.onclick = restartGame;
      kirimBtn.onclick = kirimSkorKeSheet;
      refreshLeaderBtn.onclick = refreshLeaderboard;

      // Set nama random awal
      if (namaInput.value === '') {
        namaInput.value = generateRandomName();
      }

      loadQuestion();
      refreshLeaderboard();
    </script>
  </body>
</html>
