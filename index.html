<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NEON CATCHER | Futuristic Arcade Game</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="1000" height="600"></canvas>

      <div class="info-panel">
        <div class="stat">
          <span class="stat-label">⚡ SCORE</span>
          <span class="stat-value" id="scoreValue">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">💠 LIVES</span>
          <span class="stat-value" id="livesValue">3</span>
        </div>
        <div class="stat">
          <span class="stat-label">🌀 LEVEL</span>
          <span class="stat-value" id="levelValue">1</span>
        </div>
        <button class="restart-btn" id="restartButton">⟳ RESTART</button>
      </div>
      <div class="controls-hint">
        🖱️ MOUSE / SENTUH → gerakan platform futuristiks | ⚡ Tangkap bola
        energi untuk skor & combo!
      </div>
    </div>

    <div id="gameOverModal" class="overlay-message">
      <div class="message-card">
        <h2>❖ SYSTEM FAILURE ❖</h2>
        <p id="finalScoreMsg">Skor akhir: 0</p>
        <button id="modalRestartBtn">🔄 RESTART NEO 🔄</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
