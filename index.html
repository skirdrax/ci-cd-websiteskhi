<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio Saya</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="greeting">
        Halo, Saya <span class="highlight">Mahasiswa Polindra</span> 👋
      </h1>
      <p class="subtitle">
        Selamat datang di website portofolio sederhana saya
      </p>

      <div class="card">
        <img
          src="https://via.placeholder.com/150"
          alt="Profile"
          class="profile-img" />
        <h2>Nama Saya</h2>
        <p class="bio">
          Saya sedang belajar CI/CD dengan GitHub Actions dan deployment ke VPS.
        </p>

        <div class="skills">
          <span class="skill">HTML</span>
          <span class="skill">CSS</span>
          <span class="skill">JavaScript</span>
          <span class="skill">Git</span>
        </div>

        <button id="clickMeBtn" class="btn">Klik Saya!</button>
        <p id="message" class="message"></p>
      </div>

      <footer>
        <p>&copy; 2024 - Website Statis dengan CI/CD</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
