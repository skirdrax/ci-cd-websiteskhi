<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>🤡 BUZZER INDONESIA | Cek seberapa buzzer anda</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
        font-family: 'Segoe UI', 'Poppins', monospace;
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app-wrap {
        max-width: 1300px;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      /* GAME PANEL - Lebih besar */
      .game-panel {
        flex: 1.6;
        min-width: 340px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 48px;
        padding: 24px;
        border: 1px solid gold;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
      }

      /* LEADER PANEL - Lebih kecil & ramping */
      .leader-panel {
        flex: 0.6;
        min-width: 250px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 32px;
        padding: 15px;
        border: 1px solid cyan;
      }

      h1 {
        font-size: 1.5rem;
        text-align: center;
        background: linear-gradient(135deg, gold, #ffb347);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 6px;
      }

      .sub {
        text-align: center;
        color: #aaa;
        margin-bottom: 12px;
        font-size: 0.65rem;
        letter-spacing: 1px;
      }

      h2 {
        color: cyan;
        font-size: 0.9rem;
        margin-bottom: 8px;
        text-align: center;
      }

      .nama-wrapper {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .nama-input {
        flex: 2;
        padding: 10px 14px;
        border-radius: 60px;
        border: 1px solid gold;
        background: #0a0f1e;
        color: white;
        font-size: 0.9rem;
        outline: none;
        font-weight: bold;
        text-align: center;
      }

      .btn-random {
        background: #2c3e66;
        border: 1px solid cyan;
        padding: 0 18px;
        border-radius: 60px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .indikator-soal {
        text-align: center;
        color: cyan;
        font-size: 0.75rem;
        margin-bottom: 12px;
        background: rgba(0, 0, 0, 0.5);
        display: inline-block;
        width: 100%;
        padding: 6px;
        border-radius: 30px;
      }

      .question-card {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 32px;
        padding: 18px;
        margin: 12px 0;
        border: 1px solid rgba(255, 215, 0, 0.4);
      }

      .question {
        font-size: 1rem;
        font-weight: bold;
        color: #ffe484;
        margin-bottom: 18px;
        line-height: 1.4;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* TOMBOL OPTION DIPERBESAR */
      .option-btn {
        background: #1e1e3a;
        border: 1.5px solid gold;
        padding: 12px 16px;
        border-radius: 60px;
        font-weight: bold;
        color: #f0f0f0;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.9rem;
        text-align: left;
      }

      .option-btn:hover:not(:disabled) {
        background: gold;
        color: black;
        transform: scale(1.02);
      }

      .option-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .feedback {
        margin-top: 12px;
        padding: 10px;
        border-radius: 40px;
        text-align: center;
        font-weight: bold;
        font-size: 0.85rem;
      }

      .feedback.benar {
        background: #1b5e2a;
        color: #e8f5e9;
        animation: blinkGreen 0.3s ease;
      }

      .feedback.salah {
        background: #a51c30;
        color: #fff0f0;
      }

      @keyframes blinkGreen {
        0% {
          transform: scale(1);
          background: #2e8b3a;
        }
        50% {
          transform: scale(1.02);
          background: #4caf50;
        }
        100% {
          transform: scale(1);
          background: #1b5e2a;
        }
      }

      .score-badge {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        background: #00000066;
        border-radius: 60px;
        padding: 6px 18px;
        margin: 12px 0 5px;
        flex-wrap: wrap;
      }

      .score-badge span {
        background: gold;
        padding: 4px 18px;
        border-radius: 60px;
        font-size: 1.2rem;
        font-weight: bold;
        color: black;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 8px 18px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.8rem;
      }

      .btn-next {
        background: linear-gradient(95deg, gold, #ffae42);
        color: #1e1e2a;
      }

      .btn-restart {
        background: #2a2a4a;
        border: 1px solid cyan;
        color: cyan;
      }

      .btn-send {
        background: #0f6b3a;
        border: 1px solid #25d865;
        color: white;
      }

      .btn-refresh {
        background: #005c99;
        border: 1px solid cyan;
        color: white;
        padding: 5px 12px;
        font-size: 0.7rem;
      }

      /* LEADERBOARD LEBIH KECIL & RAPIH */
      .leader-list {
        max-height: 300px;
        overflow-y: auto;
        margin-top: 8px;
      }

      .leader-item {
        display: flex;
        justify-content: space-between;
        background: rgba(0, 255, 255, 0.1);
        margin: 4px 0;
        padding: 4px 8px;
        border-radius: 40px;
        border-left: 3px solid cyan;
        font-weight: bold;
        font-size: 0.7rem;
      }

      .rank {
        color: cyan;
        font-weight: bold;
        min-width: 28px;
      }

      .leader-name {
        color: #ffd966;
        text-transform: capitalize;
        flex: 1;
        margin-left: 8px;
      }

      .leader-score {
        background: gold;
        padding: 2px 8px;
        border-radius: 30px;
        color: black;
        font-size: 0.65rem;
        font-weight: bold;
      }

      .loading {
        text-align: center;
        color: cyan;
        padding: 12px;
        font-size: 0.7rem;
      }

      @media (max-width: 750px) {
        .app-wrap {
          flex-direction: column;
        }
        .leader-panel {
          min-width: 100%;
        }
        .question {
          font-size: 0.9rem;
        }
        .option-btn {
          padding: 10px 14px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrap">
      <div class="game-panel">
        <h1>🤡 BUZZER INDONESIA 🤡</h1>
        <div class="sub">⚡ +10 POIN SETIAP JAWABAN BENAR! ⚡</div>

        <div class="nama-wrapper">
          <input
            type="text"
            id="namaUser"
            class="nama-input"
            placeholder="NAMA / NICKNAME"
            maxlength="30" />
          <button id="randomNamaBtn" class="btn-random">🎲 RANDOM</button>
        </div>

        <div class="indikator-soal" id="indikatorSoal">
          📌 Soal ke-1 dari 10
        </div>

        <div class="question-card">
          <div class="question" id="question">Memuat pertanyaan...</div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
        </div>

        <div class="score-badge">
          <span>🎯 TOTAL SKOR</span>
          <span id="scoreValue">0</span>
        </div>

        <div class="btn-group">
          <button id="nextBtn" class="btn btn-next">➡️ LANJUTKAN</button>
          <button id="restartBtn" class="btn btn-restart">🔄 ULANG GAME</button>
          <button id="kirimSkorBtn" class="btn btn-send">📤 KIRIM SKOR</button>
        </div>
      </div>

      <div class="leader-panel">
        <h2>🏆 PAPAN BUZZER 🏆</h2>
        <div id="leaderArea">
          <div class="loading">Menarik data...</div>
        </div>
        <div style="text-align: center; margin-top: 8px">
          <button id="refreshLeaderBtn" class="btn btn-refresh">
            🔄 REFRESH
          </button>
        </div>
        <div class="sub" style="margin-top: 8px">
          Klik KIRIM SKOR setelah selesai!
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://sheetdb.io/api/v1/8j9zcfxbu9upo';

      const questionsRaw = [
        {
          q: 'Pemerintah menaikkan harga BBM, sikap paling tepat sebagai buzzer?',
          opt: [
            'Tetap mendukung kebijakan pemerintah demi kepentingan nasional',
            'Mengkritik kebijakan karena memberatkan rakyat kecil',
            'Memilih diam tidak berkomentar',
            'Membagikan informasi keliru tentang kenaikan BBM',
          ],
          answer: 0,
          buzz: 'BUZZER SEJATI! +10 POIN!',
        },
        {
          q: 'Jalan di daerah tertinggal masih banyak rusak. Komentar Anda sebagai buzzer?',
          opt: [
            'Pemerintah memiliki rencana jangka panjang yang matang',
            'Ini bukti nyata kegagalan pembangunan',
            'Lebih baik fokus ke kota besar dulu',
            'Tidak perlu dibangun',
          ],
          answer: 0,
          buzz: 'LOYALITAS TINGGI! +10 POIN!',
        },
        {
          q: 'Pejabat korupsi tapi masih menjabat. Sikap ideal buzzer?',
          opt: [
            'Menunggu proses hukum dan hormati praduga tak bersalah',
            'Langsung tuntut mundur',
            'Sebarkan meme dan gosip',
            'Korupsi hal biasa',
          ],
          answer: 0,
          buzz: 'SABAR & SETIA! +10 POIN!',
        },
        {
          q: 'Program IKN menuai kritik soal anggaran. Komentar kamu?',
          opt: [
            'Proyek strategis jangka panjang demi pemerataan',
            'Anggaran terlalu besar, lebih baik untuk rakyat miskin',
            'Proyek gagal dari awal',
            'Tidak perlu menanggapi kritik',
          ],
          answer: 0,
          buzz: 'PRO PEMERINTAH! +10 POIN!',
        },
        {
          q: 'Efisiensi anggaran di kementerian. Sikap tepat buzzer?',
          opt: [
            'Langkah tepat demi kemajuan negara',
            'Pemerintah tidak becus',
            'Efisiensi hambat program rakyat',
            'Protes karena tidak diajak',
          ],
          answer: 0,
          buzz: 'BUZZER HEBAT! +10 POIN!',
        },
        {
          q: 'Angka kemiskinan masih tinggi. Komentar ideal buzzer?',
          opt: [
            'Program pengentasan berjalan bertahap',
            'Pemerintah tidak serius',
            'Data BPS tidak penting',
            'Kemiskinan tidak penting',
          ],
          answer: 0,
          buzz: 'TETAP SEMANGAT! +10 POIN!',
        },
        {
          q: 'Investasi besar dari perusahaan asing. Tanggapan kamu?',
          opt: [
            'Bukti kepercayaan dunia pada pemerintahan sekarang',
            'Menguras sumber daya lokal',
            'Tidak jelas manfaatnya',
            'Tolak karena tidak pro dalam negeri',
          ],
          answer: 0,
          buzz: 'EKONOMI MENDING! +10 POIN!',
        },
        {
          q: 'Menteri lamban respons krisis pangan. Komentar buzzer?',
          opt: [
            'Presiden sudah kasih arahan, kita tunggu',
            'Menteri harus diganti',
            'Tidak perlu menteri',
            'Krisis pangan hoax',
          ],
          answer: 0,
          buzz: 'BUZZER LANGKA! +10 POIN!',
        },
        {
          q: 'APBN 2025 fokus infrastruktur & pertahanan. Reaksi Anda?',
          opt: [
            'Tepat sasaran untuk kemajuan Indonesia',
            'Harusnya untuk kesehatan rakyat',
            'Anggaran terlalu besar',
            'Tidak usah bangun apapun',
          ],
          answer: 0,
          buzz: 'SETIA! +10 POIN!',
        },
        {
          q: 'Presiden instruksikan digitalisasi birokrasi. Komentar buzzer sejati?',
          opt: [
            'Langkah maju menuju Indonesia Emas!',
            'Efisiensi hanya di atas kertas',
            'Memberatkan PNS kecil',
            'Rakyat butuh sembako murah',
          ],
          answer: 0,
          buzz: 'SIAP BELA! +10 POIN!',
        },
      ];

      function shuffleOptions(q) {
        let optionsWithIndex = q.opt.map((opt, idx) => ({ opt, idx }));
        for (let i = optionsWithIndex.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [optionsWithIndex[i], optionsWithIndex[j]] = [
            optionsWithIndex[j],
            optionsWithIndex[i],
          ];
        }
        return {
          question: q.q,
          opt: optionsWithIndex.map((item) => item.opt),
          answer: optionsWithIndex.findIndex((item) => item.idx === q.answer),
          buzz: q.buzz,
        };
      }

      let questions = [];
      let currentIndex = 0,
        userScore = 0,
        answered = false,
        totalSoal = 10;

      const questionEl = document.getElementById('question');
      const optionsEl = document.getElementById('options');
      const feedbackEl = document.getElementById('feedback');
      const scoreSpan = document.getElementById('scoreValue');
      const namaInput = document.getElementById('namaUser');
      const indikatorEl = document.getElementById('indikatorSoal');
      const randomBtn = document.getElementById('randomNamaBtn');
      const nextBtn = document.getElementById('nextBtn');
      const restartBtn = document.getElementById('restartBtn');
      const kirimBtn = document.getElementById('kirimSkorBtn');
      const refreshLeaderBtn = document.getElementById('refreshLeaderBtn');
      const leaderArea = document.getElementById('leaderArea');

      function generateRandomName() {
        const depan = [
          'BUZZER',
          'GENERAL',
          'BOCIL',
          'SATRIA',
          'RAJA',
          'GARUDA',
          'MERAH',
          'NUSANTARA',
          'KUAT',
          'SANTRI',
        ];
        const belakang = [
          'SEJATI',
          'KAMPANYE',
          'SUPRA',
          'CECEP',
          'BUDI',
          'JOKO',
          'POLINDRA',
          'WIJAYA',
          'PERKASA',
          'GEMILANG',
        ];
        return `${depan[Math.floor(Math.random() * depan.length)]} ${belakang[Math.floor(Math.random() * belakang.length)]}${Math.floor(Math.random() * 99)}`;
      }

      randomBtn.onclick = () => (namaInput.value = generateRandomName());

      function loadQuestion() {
        answered = false;
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        const q = questions[currentIndex];
        questionEl.innerText = q.question;
        indikatorEl.innerText = `📌 Soal ke-${currentIndex + 1} dari ${totalSoal}`;
        optionsEl.innerHTML = '';
        q.opt.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => answerQuestion(idx);
          optionsEl.appendChild(btn);
        });
      }

      function answerQuestion(selected) {
        if (answered) return;
        const q = questions[currentIndex];
        const benar = selected === q.answer;
        if (benar) {
          userScore += 10;
          scoreSpan.innerText = userScore;
          feedbackEl.innerHTML = `✅ ${q.buzz} ✅`;
          feedbackEl.className = 'feedback benar';
        } else {
          feedbackEl.innerHTML = `❌ SALAH! Jawaban benar: "${q.opt[q.answer]}" ❌`;
          feedbackEl.className = 'feedback salah';
        }
        answered = true;
        document
          .querySelectorAll('.option-btn')
          .forEach((btn) => (btn.disabled = true));
      }

      function nextSoal() {
        if (!answered) {
          Swal.fire({
            icon: 'warning',
            title: 'Belum dijawab!',
            text: 'Jawab dulu soalnya ya buzzer!',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          return;
        }
        if (currentIndex + 1 < totalSoal) {
          currentIndex++;
          loadQuestion();
        } else {
          Swal.fire({
            icon: 'success',
            title: 'GAME SELESAI!',
            text: `Skor akhir kamu: ${userScore}/${totalSoal * 10}`,
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          feedbackEl.innerHTML = `🏁 SELESAI! SKOR: ${userScore}/${totalSoal * 10} 🏁`;
          feedbackEl.className = 'feedback benar';
          nextBtn.disabled = true;
          nextBtn.style.opacity = '0.5';
        }
      }

      function restartGame() {
        currentIndex = 0;
        userScore = 0;
        answered = false;
        scoreSpan.innerText = userScore;
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        questions = questionsRaw.map((q) => shuffleOptions(q));
        loadQuestion();
        feedbackEl.innerHTML = '';
      }

      async function kirimSkorKeSheet() {
        let nama = namaInput.value.trim();
        if (!nama) {
          Swal.fire({
            icon: 'error',
            title: 'Nama kosong!',
            text: 'Isi nama dulu (klik RANDOM)',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
          return;
        }
        const data = {
          nama: nama,
          skor: userScore,
          tanggal: new Date().toLocaleString('id-ID'),
        };
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            Swal.fire({
              icon: 'success',
              title: 'BERHASIL!',
              text: `Skor ${userScore} atas nama ${nama} terkirim!`,
              background: '#1e1e3a',
              color: '#ffd966',
              confirmButtonColor: '#ffae42',
            });
            refreshLeaderboard();
          } else throw new Error();
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: 'GAGAL!',
            text: 'Cek koneksi atau API.',
            background: '#1e1e3a',
            color: '#ffd966',
            confirmButtonColor: '#ffae42',
          });
        }
      }

      async function refreshLeaderboard() {
        leaderArea.innerHTML =
          '<div class="loading">⏳ Mengambil data...</div>';
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          let list = data
            .filter((r) => r.nama && r.skor)
            .map((r) => ({ nama: r.nama, skor: parseInt(r.skor) || 0 }));
          list.sort((a, b) => b.skor - a.skor);
          leaderArea.innerHTML =
            list
              .slice(0, 10)
              .map(
                (item, idx) => `
                <div class="leader-item">
                    <span class="rank">${idx + 1}.</span>
                    <span class="leader-name">${escapeHtml(item.nama)}</span>
                    <span class="leader-score">${item.skor}</span>
                </div>
            `,
              )
              .join('') || '<div class="loading">Belum ada data</div>';
        } catch (e) {
          leaderArea.innerHTML = '<div class="loading">Gagal muat</div>';
        }
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>]/g,
          (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m],
        );
      }

      nextBtn.onclick = nextSoal;
      restartBtn.onclick = restartGame;
      kirimBtn.onclick = kirimSkorKeSheet;
      refreshLeaderBtn.onclick = refreshLeaderboard;

      if (!namaInput.value) namaInput.value = generateRandomName();
      questions = questionsRaw.map((q) => shuffleOptions(q));
      loadQuestion();
      refreshLeaderboard();
    </script>
  </body>
</html>
