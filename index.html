<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NEON SNAKE — Cyberpunk Edition</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <!-- Background grid -->
    <div class="bg-grid"></div>
    <div class="scanlines"></div>

    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="title-wrap">
          <span class="title-prefix">◈</span>
          <h1 class="title">NEON<span class="title-accent">SNAKE</span></h1>
          <span class="title-prefix">◈</span>
        </div>
        <p class="subtitle">CYBERPUNK EDITION</p>
      </header>

      <!-- Score Panel -->
      <div class="score-panel">
        <div class="score-item">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">000000</span>
        </div>
        <div class="score-divider">|</div>
        <div class="score-item">
          <span class="score-label">BEST</span>
          <span class="score-value" id="highscore">000000</span>
        </div>
        <div class="score-divider">|</div>
        <div class="score-item">
          <span class="score-label">LVL</span>
          <span class="score-value" id="level">01</span>
        </div>
      </div>

      <!-- Game Canvas Wrapper -->
      <div class="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- Overlay: Start Screen -->
        <div class="overlay" id="startScreen">
          <div class="overlay-content">
            <div class="glitch-text" data-text="NEON SNAKE">NEON SNAKE</div>
            <p class="overlay-sub">— CYBERPUNK EDITION —</p>
            <div class="key-hints">
              <div class="hint">
                <span class="key">↑↓←→</span>
                <span class="hint-label">atau WASD</span>
              </div>
              <div class="hint">
                <span class="key">SWIPE</span>
                <span class="hint-label">di layar sentuh</span>
              </div>
            </div>
            <button class="btn-start" id="startBtn">
              <span class="btn-glow"></span>
              ▶ MULAI GAME
            </button>
          </div>
        </div>

        <!-- Overlay: Game Over -->
        <div class="overlay hidden" id="gameOverScreen">
          <div class="overlay-content">
            <div class="gameover-title">GAME OVER</div>
            <div class="gameover-stats">
              <div class="stat-row">
                <span class="stat-label">SKOR AKHIR</span>
                <span class="stat-val" id="finalScore">0</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">REKOR TERTINGGI</span>
                <span class="stat-val highlight" id="finalBest">0</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">LEVEL DICAPAI</span>
                <span class="stat-val" id="finalLevel">1</span>
              </div>
            </div>
            <div id="newRecordBadge" class="new-record hidden">
              🏆 REKOR BARU!
            </div>
            <button class="btn-start" id="restartBtn">
              <span class="btn-glow"></span>
              ↺ MAIN LAGI
            </button>
          </div>
        </div>

        <!-- Pause indicator -->
        <div class="pause-indicator hidden" id="pauseIndicator">⏸ PAUSE</div>
      </div>

      <!-- Controls bar -->
      <div class="controls-bar">
        <button class="ctrl-btn" id="pauseBtn" title="Pause">⏸</button>
        <div class="speed-display">
          <span class="speed-label">SPEED</span>
          <div class="speed-bars" id="speedBars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <button class="ctrl-btn" id="soundBtn" title="Sound">🔊</button>
      </div>

      <!-- Mobile D-Pad -->
      <div class="dpad" id="dpad">
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="UP">▲</button>
        </div>
        <div class="dpad-row dpad-mid">
          <button class="dpad-btn" data-dir="LEFT">◄</button>
          <div class="dpad-center">◈</div>
          <button class="dpad-btn" data-dir="RIGHT">►</button>
        </div>
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="DOWN">▼</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
